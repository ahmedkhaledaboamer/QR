<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HI Academy | جميع الروابط</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#F8F7F3;
    --bg-1:#FFFFFF;
    --panel:#FFFFFF;
    --panel-border:#E8E3D7;
    --gold-1:#F0D183;
    --gold-2:#C9962E;
    --gold-3:#8A6415;
    --text-hi:#292722;
    --text-lo:#77736B;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    width:100%;
    height:100%;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(201,150,46,0.18), transparent 70%),
      var(--bg-0);
    color:var(--text-hi);
    font-family:'Tajawal','Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 32px;
   }

  .page{
    width:100%;
    max-width:1000px;
    max-height:100%;
    display:grid;
    direction:ltr;
    grid-template-columns:minmax(280px, 1fr) minmax(360px, 1fr);
    grid-template-rows:auto auto;
    column-gap:clamp(48px, 8vw, 110px);
    align-items:center;
  }

  .identity{
    grid-column:1;
    grid-row:1;
    direction:rtl;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- Logo + radiating signature ---------- */
  .logo-wrap{
    position:relative;
    width:172px;
    height:172px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:26px;
  }

  .ray{
    position:absolute;
    width:3px;
    height:16px;
    border-radius:3px;
    background:linear-gradient(var(--gold-1), var(--gold-3));
    top:50%;
    left:50%;
    transform-origin:0 86px;
    opacity:.55;
    animation:pulse 4.5s ease-in-out infinite;
  }
  .ray:nth-child(1){ transform: translate(-50%,-86px) rotate(0deg) translateY(-86px) rotate(0deg); }

  /* generate 12 rays via individual rotations */
  .ray:nth-of-type(1){ transform: rotate(0deg) translate(0,-92px); }
  .ray:nth-of-type(2){ transform: rotate(30deg) translate(0,-92px); animation-delay:.2s;}
  .ray:nth-of-type(3){ transform: rotate(60deg) translate(0,-92px); animation-delay:.4s;}
  .ray:nth-of-type(4){ transform: rotate(90deg) translate(0,-92px); animation-delay:.6s;}
  .ray:nth-of-type(5){ transform: rotate(120deg) translate(0,-92px); animation-delay:.8s;}
  .ray:nth-of-type(6){ transform: rotate(150deg) translate(0,-92px); animation-delay:1s;}
  .ray:nth-of-type(7){ transform: rotate(180deg) translate(0,-92px); animation-delay:1.2s;}
  .ray:nth-of-type(8){ transform: rotate(210deg) translate(0,-92px); animation-delay:1.4s;}
  .ray:nth-of-type(9){ transform: rotate(240deg) translate(0,-92px); animation-delay:1.6s;}
  .ray:nth-of-type(10){ transform: rotate(270deg) translate(0,-92px); animation-delay:1.8s;}
  .ray:nth-of-type(11){ transform: rotate(300deg) translate(0,-92px); animation-delay:2s;}
  .ray:nth-of-type(12){ transform: rotate(330deg) translate(0,-92px); animation-delay:2.2s;}

  @keyframes pulse{
    0%,100%{ opacity:.25; }
    50%{ opacity:.75; }
  }

  .logo-disc{
    position:relative;
    width:150px;
    height:150px;
    border-radius:50%;
    background:
      url("images/logo.png") center / 104px auto no-repeat,
      radial-gradient(circle at 35% 30%, #FFFDF7, #F1E9D7 72%);
    border:1px solid var(--panel-border);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 1px rgba(240,209,131,0.18), 0 20px 40px -18px rgba(100,80,35,0.28);
  }

  .logo-disc img{
    display:none;
  }
  .logo-disc .logo-image{
    width:104px;
    height:auto;
    display:block;
    filter:drop-shadow(0 4px 10px rgba(100,80,35,0.2));
  }

  /* ---------- Title ---------- */
  h4{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px;
    letter-spacing:.12em;
    font-weight:700;
    color:var(--text-hi);
    text-align:center;
  }

  .divider{
    width:38px;
    height:2px;
    margin:14px 0 10px;
    background:linear-gradient(90deg, var(--gold-3), var(--gold-1), var(--gold-3));
    border-radius:2px;
  }

  .subtitle{
    font-size:14px;
    color:var(--text-lo);
    text-align:center;
    margin-bottom:34px;
     letter-spacing:.02em;
  }

  /* ---------- Links ---------- */
  .links{
    grid-column:2;
    grid-row:1;
    direction:rtl;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    text-decoration:none;
    color:var(--text-hi);
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
    overflow:hidden;
  }

  .link-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, rgba(240,209,131,0.08), transparent 60%);
    opacity:0;
    transition:opacity .18s ease;
  }

  .link-card:hover{
    transform:translateY(-2px);
    border-color:var(--gold-2);
    background:#FFFDF7;
  }
  .link-card:hover::before{ opacity:1; }

  .icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#FBF8EF;
    border:1px solid var(--panel-border);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon img{
    width:24px;
    height:24px;
    object-fit:contain;
    display:block;
  }

  .link-text{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:right;
  }
  .link-title{
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
  }
  .link-sub{
    font-size:12px;
    color:var(--text-lo);
    direction:ltr;
    text-align:right;
    unicode-bidi:plaintext;
  }

  .arrow{
    flex:0 0 auto;
    width:16px;
    height:16px;
    opacity:.5;
    transition:transform .18s ease, opacity .18s ease;
  }
  .link-card:hover .arrow{ transform:translateX(-3px); opacity:1; }

  /* ---------- Footer ---------- */
  footer{
    grid-column:1 / -1;
    grid-row:2;
    margin-top:40px;
    text-align:center;
    color:var(--text-lo);
    font-size:12px;
    letter-spacing:.03em;
  }
  footer .brand{
    color:var(--gold-1);
    font-weight:700;
  }

  @media (max-width:700px){
    body{ padding:16px 18px; }
    .page{
      display:flex;
      flex-direction:column;
      gap:24px;
    }
    .identity{ width:100%; }
    .links{ width:100%; }
    footer{ margin-top:0; }
  }

  @media (max-width:380px){
    body{ padding:10px 14px; }
    .logo-wrap{ width:150px; height:150px; }
    .logo-disc{ width:130px; height:130px; }
    .logo-disc img{ width:88px; }
    h4{ font: size 12px; }
    .subtitle{ margin-bottom:18px; margin-top:50px; }
    .link-card{ padding:11px 14px; }
    .links{ gap:8px; }
  }
</style>
</head>
